# LoRA SFT config for NVIDIA Nemotron 3.5 Lightning 30B-A3B.
#
# Architecture notes (model_type: nemotron_h, 52 layers, verified against the
# BF16 safetensors index):
#   - Hybrid stack of mamba / attention / MoE layers.
#   - Attention layers expose q_proj, k_proj, v_proj, o_proj.
#   - Mamba layers expose in_proj, out_proj (plus conv1d/A_log/D/dt_bias, which
#     are not linear layers and cannot take LoRA adapters).
#   - MoE layers expose 128 routed experts, each with up_proj/down_proj, plus a
#     shared expert and a router `gate`. Targeting bare "up_proj"/"down_proj"
#     would attach adapters to 128 experts x 26 MoE layers, so the routed
#     experts are deliberately left untouched.
#   - There is NO gate_proj and NO `mlp` module, so the Qwen-style target list
#     in the other configs does not apply here.
#   - `mtp.*` is the multi-token-prediction head. It repeats q_proj/k_proj/
#     v_proj/o_proj, so it is excluded explicitly.
#
# Base model options (all public, non-gated):
#   nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16          <- default, instruct
#   nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-Base-BF16     <- base, for CPT
#   mlasli/Nemotron-3.5-Lightning-30B-A3B-Heretic-Uncensored-BF16
#   HangGlidersRule/Darkstar-Nemotron-3.5-Lightning-30B-A3B-Abliterated-BF16
#
# Do NOT point base_model at the -NVFP4 repo. That checkpoint is a ModelOpt
# MIXED_PRECISION export (FP8 attention + W4A16_NVFP4 experts) intended for
# TensorRT-LLM / vLLM inference on Blackwell. It is not trainable through PEFT.
#
# Launch remotely:
#   ./scripts/launch_nemotron35_hf_job.sh h200 6h
#
# Validate locally without downloading 60GB of weights:
#   python3 scripts/train_lora.py \
#     --config configs/nemotron35_lightning_lora.yaml --dry-run

base_model: "nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16"
model_revision: "main"
torch_dtype: "bfloat16"
device_map: "auto"

# Dataset
dataset_repo: "solanaclawd/solana-clawd-core-ai-instruct"
dataset_revision: "main"
dataset_path: "data/combined_processed"
max_seq_length: 4096
train_split: "train"
eval_split: "eval"

# Output
output_dir: "outputs/nemotron35-lightning-30b-clawd-lora"
push_to_hub: false
hub_model_id: "solanaclawd/solana-clawd-nemotron35-lightning-30b-lora"
hub_private: false

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    # attention layers
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    # mamba mixer input projection. `out_proj` and `conv1d` are deliberately
    # absent: PEFT hard-rejects them for mamba-based model types
    # (tuners_utils._check_lora_target_modules_mamba), because adapting them
    # breaks the fused selective-scan path.
    - "in_proj"
    # shared-expert MLP. Safe to name bare: the 128 routed experts are stored as
    # fused 3D tensors on a NemotronHExperts module, not as nn.Linear children,
    # so these names resolve only to the always-active shared expert.
    - "up_proj"
    - "down_proj"
  exclude_modules:
    # The checkpoint ships multi-token-prediction weights (mtp.layers.*.mixer.
    # q_proj etc.) that reuse the projection names above. AutoModelForCausalLM
    # does not currently build that head, so PEFT logs
    #   "You have passed exclude_modules={'mtp'} but no modules were excluded"
    # That warning is expected and harmless; the entry stays as a guard in case
    # a future transformers release does instantiate the head.
    - "mtp"

training:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  per_device_eval_batch_size: 1
  num_train_epochs: 1
  max_steps: -1
  learning_rate: 1.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.0
  optim: "adamw_torch"
  bf16: true
  fp16: false
  tf32: true
  gradient_checkpointing: true
  logging_steps: 10
  save_steps: 500
  save_total_limit: 2
  eval_steps: 500
  eval_strategy: "steps"
  report_to:
    - "none"
  seed: 42
  dataloader_num_workers: 2
  remove_unused_columns: false

# 30B in bf16 is ~60GB of weights. That fits an H200 (141GB) comfortably and an
# A100-80GB tightly. Enable 4-bit only if you must run on smaller hardware --
# bitsandbytes quantization of the mamba/MoE hybrid is less well-trodden than it
# is for dense Llama/Qwen models.
quantization:
  enabled: false
  load_in_4bit: true
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true

sft:
  packing: false
  assistant_only_loss: true
  chat_template_kwargs: {}
