# LoRA SFT config for Clawd on Qwen/Qwen3.8-27B (official multimodal VLM).
#
# Base is the Hugging Face image-text-to-text checkpoint:
#   pipeline("image-text-to-text", model="Qwen/Qwen3.8-27B")
#   AutoProcessor + AutoModelForMultimodalLM.from_pretrained(..., device_map="auto")
#
# Dry-run (no 27B weight download):
#   python3 scripts/train_lora.py --config configs/qwen38_27b_clawd_lora.yaml --dry-run
#
# GPU train (8xH100-class; do not attempt on a laptop):
#   python3 scripts/train_lora.py --config configs/qwen38_27b_clawd_lora.yaml --no-push
#   ./scripts/launch_hf_jobs.sh a100-large qwen38

base_model: "Qwen/Qwen3.8-27B"
model_revision: "main"
torch_dtype: "bfloat16"
device_map: "auto"
loader: "automodel_for_multimodal_lm"
pipeline_task: "image-text-to-text"

# Multi-source SFT mix: local Alpaca + chat JSONLs, plus optional Hub distillation.
# Do not point this lane at the 80-row nemo_clawd chat_finetune fallback.
dataset_repo: "solanaclawd/solana-clawd-instruct"
dataset_revision: "main"
dataset_path: "solana1_yourgpt.jsonl"
dataset_format: "json"
dataset_sources:
  - path: solana1_yourgpt.jsonl
  - path: trainingday.jsonl
dataset_hub:
  repo: "r0b0tlab/qwen3.8-max-glm5.2-kimi-k3-distillation"
  configs:
    - sft_balanced
    - canonical
    - glm47_native
  max_rows_per_config: 2000
max_seq_length: 4096
train_split: "train"
eval_split: "eval"

output_dir: "outputs/solana-clawd-qwen38-27b-lora"
push_to_hub: false
hub_model_id: "solanaclawd/solana-clawd-qwen38-27b-lora"
hub_private: false

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  per_device_eval_batch_size: 1
  num_train_epochs: 1
  max_steps: -1
  learning_rate: 1.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.0
  optim: "adamw_torch"
  bf16: true
  fp16: false
  tf32: true
  gradient_checkpointing: true
  logging_steps: 10
  save_steps: 200
  save_total_limit: 2
  eval_steps: 200
  eval_strategy: "no"
  report_to:
    - "none"
  seed: 42
  dataloader_num_workers: 2
  remove_unused_columns: false

quantization:
  enabled: true
  load_in_4bit: true
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true

sft:
  packing: false
  assistant_only_loss: true
  chat_template_kwargs: {}
