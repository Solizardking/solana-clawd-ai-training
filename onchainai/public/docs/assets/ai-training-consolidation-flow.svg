<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Solana Clawd ai-training consolidation flow</title>
  <desc id="desc">Animated paths show root outputs, NVIDIA outputs, and existing datasets flowing into the ai-training workspace.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#101827"/>
      <stop offset="45%" stop-color="#172033"/>
      <stop offset="100%" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" x2="1">
      <stop offset="0%" stop-color="#14F195"/>
      <stop offset="55%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#9945FF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .label { fill: #E5E7EB; font: 700 18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .small { fill: #A7B4C8; font: 500 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .tiny { fill: #CBD5E1; font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .path { fill: none; stroke: url(#flow); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 16 16; animation: dash 1.7s linear infinite; }
      .soft { fill: none; stroke: #334155; stroke-width: 2; }
      .pulse { animation: pulse 1.6s ease-in-out infinite; transform-origin: center; }
      .pulse2 { animation: pulse 1.6s ease-in-out infinite .35s; transform-origin: center; }
      .pulse3 { animation: pulse 1.6s ease-in-out infinite .7s; transform-origin: center; }
      @keyframes dash { to { stroke-dashoffset: -32; } }
      @keyframes pulse {
        0%, 100% { opacity: .58; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.06); }
      }
    </style>
  </defs>

  <rect width="960" height="360" rx="22" fill="url(#bg)"/>
  <circle cx="160" cy="78" r="70" fill="#14F195" opacity=".08"/>
  <circle cx="790" cy="285" r="92" fill="#9945FF" opacity=".10"/>

  <rect x="44" y="46" width="250" height="86" rx="14" fill="url(#panel)" stroke="#334155"/>
  <text x="68" y="82" class="label">root outputs</text>
  <text x="68" y="108" class="small">legacy 1.5B LoRA metadata</text>

  <rect x="44" y="148" width="250" height="86" rx="14" fill="url(#panel)" stroke="#334155"/>
  <text x="68" y="184" class="label">NVIDIA outputs</text>
  <text x="68" y="210" class="small">tx-foundation 1.5B CPT/SFT</text>

  <rect x="44" y="250" width="250" height="66" rx="14" fill="url(#panel)" stroke="#334155"/>
  <text x="68" y="288" class="label">existing lanes</text>
  <text x="68" y="310" class="small">data, model-kit, GGUF builds</text>

  <rect x="394" y="78" width="190" height="204" rx="18" fill="#101827" stroke="#475569" stroke-width="2"/>
  <text x="431" y="122" class="label">ai-training</text>
  <text x="430" y="150" class="small">canonical workspace</text>
  <rect x="424" y="174" width="130" height="28" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="451" y="193" class="tiny">outputs/</text>
  <rect x="424" y="210" width="130" height="28" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="461" y="229" class="tiny">ollama/</text>
  <rect x="424" y="246" width="130" height="28" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="470" y="265" class="tiny">docs/</text>

  <rect x="666" y="56" width="250" height="86" rx="14" fill="url(#panel)" stroke="#334155"/>
  <text x="690" y="92" class="label">imported archive</text>
  <text x="690" y="118" class="small">imported-root-outputs-20260704</text>

  <rect x="666" y="164" width="250" height="86" rx="14" fill="url(#panel)" stroke="#334155"/>
  <text x="690" y="200" class="label">usable adapters</text>
  <text x="690" y="226" class="small">CPT + SFT safetensors</text>

  <rect x="666" y="272" width="250" height="52" rx="14" fill="url(#panel)" stroke="#334155"/>
  <text x="690" y="304" class="label">old path still works</text>

  <path class="soft" d="M294 89 C340 89 348 120 394 120"/>
  <path class="path" d="M294 89 C340 89 348 120 394 120"/>
  <path class="soft" d="M294 191 C350 191 342 180 394 180"/>
  <path class="path" d="M294 191 C350 191 342 180 394 180"/>
  <path class="soft" d="M294 283 C348 283 344 238 394 238"/>
  <path class="path" d="M294 283 C348 283 344 238 394 238"/>

  <path class="soft" d="M584 138 C628 126 622 100 666 100"/>
  <path class="path" d="M584 138 C628 126 622 100 666 100"/>
  <path class="soft" d="M584 196 C628 196 622 207 666 207"/>
  <path class="path" d="M584 196 C628 196 622 207 666 207"/>
  <path class="soft" d="M584 258 C636 270 620 298 666 298"/>
  <path class="path" d="M584 258 C636 270 620 298 666 298"/>

  <circle class="pulse" cx="294" cy="89" r="8" fill="#14F195" filter="url(#glow)"/>
  <circle class="pulse2" cx="294" cy="191" r="8" fill="#2DD4BF" filter="url(#glow)"/>
  <circle class="pulse3" cx="294" cy="283" r="8" fill="#9945FF" filter="url(#glow)"/>
  <circle class="pulse" cx="666" cy="100" r="8" fill="#14F195" filter="url(#glow)"/>
  <circle class="pulse2" cx="666" cy="207" r="8" fill="#2DD4BF" filter="url(#glow)"/>
  <circle class="pulse3" cx="666" cy="298" r="8" fill="#9945FF" filter="url(#glow)"/>

  <text x="338" y="330" class="small">move, link, verify, document</text>
</svg>
