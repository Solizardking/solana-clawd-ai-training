# Hauhau Trading Factory: instant UI + DFlow proxy, llama.cpp on loopback.
# /health checks the gateway; /api/model/health checks loaded inference.

app = "solgpt-hauhau-trading-8b"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  HAUHAU_MODEL_PROFILE = "trading-factory-q4"
  LLAMA_CACHE = "/models"
  LLAMA_CTX = "8192"
  LLAMA_THREADS = "4"
  OTEL_SERVICE_NAME = "hauhau"
  OTEL_EXPORTER_OTLP_ENDPOINT = "http://solgpt-otel.internal:4318"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 40
    soft_limit = 25

[[vm]]
  size = "performance-4x"
  memory = "16gb"

[[mounts]]
  source = "hauhau_models"
  destination = "/models"

[deploy]
  strategy = "immediate"

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/health"
