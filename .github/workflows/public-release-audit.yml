name: Public release audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Install pinned secret scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Test release boundaries
        run: python3 -m unittest discover -s tests -p test_public_release.py
      - name: Audit public source and complete checked-out history
        run: python3 scripts/prepare_public_release.py --check --history
      # Reports stay private and are deliberately not uploaded as Actions artifacts.
