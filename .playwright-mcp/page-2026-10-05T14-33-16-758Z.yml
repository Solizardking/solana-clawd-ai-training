    - generic [ref=f12e61]:
      - generic [ref=f12e62]:
        - generic [ref=f12e63]: 01 / Ecosystem-native
        - heading "Built around Solana mechanics" [level=3] [ref=f12e64]
        - paragraph [ref=f12e65]: Accounts, PDAs, versioned transactions, address lookup tables, Pump.fun graduation, and RPC failure modes. Domain knowledge is part of the model.
      - generic [ref=f12e66]:
        - generic [ref=f12e67]: 02 / Sovereign by design
        - heading "The brain never holds the keys" [level=3] [ref=f12e68]
        - paragraph [ref=f12e69]: Brain/Hands separation keeps signing authority outside the model. Identity, scoped permissions, constitutional bounds, and owner-reviewed actions define the stack.
      - generic [ref=f12e70]:
        - generic [ref=f12e71]: 03 / Open artifacts
        - heading "Inspect. Reproduce. Build." [level=3] [ref=f12e72]
        - paragraph [ref=f12e73]: Weights, adapters, datasets, and research stay in their source repositories. Read each model card for compatibility, licensing, and evaluation evidence.
    - paragraph [ref=f12e74]:
      - text: "Coverage: public non-profile repositories from solanaclawd, plus Clawd/Hauhau artifacts from ordlibrary. Newly published matching repositories appear automatically. Counts refresh every 60 seconds using the Hub API; Hugging Face may update its statistics on a different schedule. These are last-30-days downloads, not unique users or lifetime counts."
      - link "Model methodology" [ref=f12e75] [cursor=pointer]:
        - /url: https://huggingface.co/docs/hub/models-download-stats
      - text: ·
      - link "Dataset methodology" [ref=f12e76] [cursor=pointer]:
